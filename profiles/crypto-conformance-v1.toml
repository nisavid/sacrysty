schema = "io.nisavid.sacrysty.crypto-conformance/v1"
status = "experimental"

[[profile]]
id = "openpgp-rfc9580-classical-v1"
standard = "RFC 9580"
status = "observed"
support_commitment = "none"
tool = "sq/sqv"
operations = ["generate", "detached-sign", "verify", "tamper-reject"]
fixture_policy = "disposable-public-value-free"

[[profile]]
id = "openpgp-rfc9980-pqc-v1"
standard = "RFC 9980"
status = "capability-gated"
tool = "sq/sqv"
operations = ["backend-probe", "generate", "detached-sign", "verify"]
qualification_rule = "A backend is qualified only after successful RFC 9980 algorithm 30 ML-DSA-65+Ed25519 generation, signing, and independent verification; advertised help text is insufficient."
current_result = "unqualified-on-the-observed-nettle-runtime"

[evidence]
format = "json"
required_bindings = ["source_revision", "reference_time", "sq_version", "sqv_version", "fixture_sha256", "fixture_sha512", "fixture_bytes", "result"]
negative_cases = ["tampered-message", "tampered-signature", "wrong-certificate", "rfc9980-backend-capability"]
secrets = "forbidden"
production_authority = "forbidden"
