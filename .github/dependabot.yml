version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - needs-triage
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - needs-triage
    groups:
      github-actions:
        patterns:
          - "*"
